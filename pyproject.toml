[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-svccore"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.11",
    "PyJWT[crypto]>=2.10",
    "requests>=2.31",
    "prometheus-client>=0.21",
    "oc-logging[tracing]>=1.3.0",
    "oc-cdtapi>=3.48",
]

[project.optional-dependencies]
db = ["SQLAlchemy>=2.0"]
cli = ["click>=8.1"]
testing = ["pytest>=8", "PyYAML>=6"]

[project.entry-points.pytest11]
oc_svccore = "oc_svccore.testing.plugin"

[tool.setuptools.packages.find]
include = ["oc_svccore*"]
